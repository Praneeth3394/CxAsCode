inboundCall:
  name: Example_Architect_CICD_demo_flow
  description: ""
  division: Home
  startUpRef: "/inboundCall/tasks/task[New Task 2_14]"
  defaultLanguage: en-us
  supportedLanguages:
    en-us:
      defaultLanguageSkill:
        noValue: true
      textToSpeech:
        defaultEngine:
          defaultVoice: true
    fr-ca:
      defaultLanguageSkill:
        noValue: true
      textToSpeech:
        defaultEngine:
          voice: Hilorie
  initialGreeting:
    exp: AudioPlaybackOptions(Append(ToAudioTTS("Hello, this is the initial greeting."), ToAudioBlank(100), ToAudioTTS("Good Morning"), ToAudioBlank(100)), true)
  variables:
    - stringVariable:
        name: Flow.language
        initialValue:
          noValue: true
  settingsActionDefaults:
    playAudioOnSilence:
      timeout:
        lit:
          seconds: 40
    detectSilence:
      timeout:
        lit:
          seconds: 40
    callData:
      processingPrompt:
        noValue: true
    collectInput:
      noEntryTimeout:
        lit:
          seconds: 5
    dialByExtension:
      interDigitTimeout:
        lit:
          seconds: 6
    transferToUser:
      connectTimeout:
        noValue: true
    transferToNumber:
      connectTimeout:
        noValue: true
    transferToGroup:
      connectTimeout:
        noValue: true
    transferToFlowSecure:
      connectTimeout:
        lit:
          seconds: 15
  settingsErrorHandling:
    errorHandling:
      disconnect:
        none: true
    preHandlingAudio:
      tts: Sorry, an error occurred. Please try your call again.
  settingsMenu:
    extensionDialingMaxDelay:
      lit:
        seconds: 1
    listenForExtensionDialing:
      lit: true
    menuSelectionTimeout:
      lit:
        seconds: 10
    repeatCount:
      lit: 3
  settingsPrompts:
    ensureAudioInPrompts: false
    promptMediaToValidate:
      - mediaType: audio
      - mediaType: tts
  settingsSpeechRec:
    completeMatchTimeout:
      lit:
        ms: 100
    incompleteMatchTimeout:
      lit:
        ms: 1500
    maxSpeechLengthTimeout:
      lit:
        seconds: 20
    minConfidenceLevel:
      lit: 50
    asrCompanyDir: none
    asrEnabledOnFlow: true
    suppressRecording: true
  tasks:
    - task:
        name: New Task 2
        refId: New Task 2_14
        variables:
          - integerVariable:
              name: Task.loopcount
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
        actions:
          - loop:
              name: Loop
              currentIndex:
                var: Task.loopcount
              loopCount:
                lit: 3
              outputs:
                loop:
                  actions:
                    - collectInput:
                        name: Collect Input
                        inputData:
                          var: Flow.language
                        digits:
                          range:
                            min: 1
                            max: 20
                        interDigitTimeout:
                          noValue: true
                        noEntryTimeout:
                          noValue: true
                        inputAudio:
                          tts: Press 1 for English and press 2 for French
                        acceptJustStar:
                          lit: false
                        acceptJustPound:
                          lit: false
                        verificationType: none
                        outputs:
                          success:
                            actions:
                              - switch:
                                  name: Switch
                                  evaluate:
                                    firstTrue:
                                      default:
                                        actions:
                                          - jumpToTask:
                                              name: Jump to Reusable Task
                                              targetTaskRef: "/inboundCall/tasks/task[English_20]"
                                      cases:
                                        - case:
                                            value:
                                              exp: flow.language == "1"
                                            actions:
                                              - jumpToTask:
                                                  name: Jump to Reusable Task
                                                  targetTaskRef: "/inboundCall/tasks/task[English_20]"
                                        - case:
                                            value:
                                              exp: flow.language == "2"
                                            actions:
                                              - jumpToTask:
                                                  name: Jump to Reusable Task
                                                  targetTaskRef: "/inboundCall/tasks/task[French_21]"
                          failure:
                            actions:
                              - decision:
                                  name: Decision
                                  condition:
                                    exp: Task.loopcount == 2
                                  outputs:
                                    "yes":
                                      actions:
                                        - playAudio:
                                            name: Play Audio
                                            audio:
                                              tts: sorry you have exceeded maxmimum tries. please call us later
                                        - disconnect:
                                            name: Disconnect
                                    "no":
                                      actions:
                                        - playAudio:
                                            name: Play Audio
                                            audio:
                                              tts: sorry you have entered wrong input. please try again
          - disconnect:
              name: Disconnect
    - task:
        name: English
        refId: English_20
        actions:
          - setLanguage:
              name: Set Language
              languageValue:
                lit: en-us
              language: en-us
          - transferToAcd:
              name: Transfer to ACD
              targetQueue:
                lit:
                  name: Example Queue_CICD_demo_1
              priority:
                lit: 0
              preferredAgents:
                noValue: true
              languageSkill:
                noValue: true
              directAgent:
                noValue: true
              failureOutputs:
                errorType:
                  noValue: true
                errorMessage:
                  noValue: true
          - disconnect:
              name: Disconnect
    - task:
        name: French
        refId: French_21
        actions:
          - setLanguage:
              name: Set Language
              languageValue:
                lit: fr-ca
              language: fr-ca
          - transferToAcd:
              name: Transfer to ACD
              targetQueue:
                lit:
                  name: Example Queue_CICD_demo_1
              priority:
                lit: 0
              preferredAgents:
                noValue: true
              languageSkill:
                noValue: true
              directAgent:
                noValue: true
              failureOutputs:
                errorType:
                  noValue: true
                errorMessage:
                  noValue: true
          - disconnect:
              name: Disconnect
